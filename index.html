<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misi Rahasia Besok ✨</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a2e;
            font-family: sans-serif;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: #222831;
            color: #eceff1;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            border: 3px solid #00adb5;
        }
        h2 { color: #00adb5; }
        .buttons {
            display: flex;
            justify-content: space-around;
            position: relative;
            margin-top: 30px;
            height: 60px;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
        #yesBtn { background: #00adb5; color: #222831; }
        #noBtn {
            background: #ff2e63;
            color: #fff;
            position: absolute;
            transition: all 0.2s ease;
        }
        .time-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .time-box {
            background: #393e46;
            border: 2px solid #00adb5;
            border-radius: 10px;
            padding: 15px 5px;
            cursor: pointer;
        }
        .time-box.selected { background: #00adb5; color: #222831; }
        .input-container { margin-top: 20px; text-align: left; }
        .input-place {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #393e46;
            background: #393e46;
            color: #fff;
            box-sizing: border-box;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- STEP 1 -->
    <div id="step1" class="card">
        <h3 id="hearts">❤️❤️❤️</h3>
        <h2>Alo Juju, Besok Luang Kan? Jalan Yuk.. 🤔✨</h2>
        <p id="dialog">Gak ada penolakan ya, klik tombol di bawah!</p>
        <div class="buttons">
            <button id="yesBtn" onclick="nextStep()">Ayo! 🚀</button>
            <button id="noBtn" onmouseover="tryReject()" onclick="tryReject()">Mager</button>
        </div>
    </div>

    <!-- STEP 2 -->
    <div id="step2" class="card hidden">
        <h2>Pilih Jam & Tempat 🔐</h2>
        <div class="time-grid">
            <div class="time-box" id="t1" onclick="selectTime('Pagi (09:00)', 't1')">🌅 Pagi</div>
            <div class="time-box" id="t2" onclick="selectTime('Siang (13:00)', 't2')">☀️ Siang</div>
            <div class="time-box" id="t3" onclick="selectTime('Sore (16:30)', 't3')">🌆 Sore</div>
            <div class="time-box" id="t4" onclick="selectTime('Malam (19:00)', 't4')">🌙 Malam</div>
        </div>
        <div class="input-container">
            <label>Ada saran tempat nongkrong? 👇</label>
            <input type="text" id="tempat" class="input-place" placeholder="Ketik nama tempat di sini...">
        </div>
        <button style="background:#00adb5; color:#222831; width:100%; margin-top:15px; border-radius:10px;" onclick="submitStep2()">Kunci Jadwal 🔒</button>
    </div>

    <!-- STEP 3 -->
    <div id="step3" class="card hidden">
        <h2>Misi Berhasil! 🏆</h2>
        <p id="finalMessage" style="font-weight:bold; color:#00adb5;"></p>
        <button onclick="sendToWhatsApp()" style="background:#25d366; color:#fff; width:100%; border-radius:10px;">Kirim ke WA 💬</button>
    </div>

    <script>
        let health = 3;
        let selectedTimeValue = "";
        const nomorWA = "628123456789"; // Ganti dengan nomor WA kamu

        // Fungsi membuat tombol kabur otomatis sejak awal
        setInterval(function() {
            const noBtn = document.getElementById('noBtn');
            const step1 = document.getElementById('step1');
            if (noBtn && !step1.classList.contains('hidden')) {
                const x = Math.random() * 100 - 50;
                const y = Math.random() * 40 - 20;
                noBtn.style.left = "calc(50% + " + x + "px)";
                noBtn.style.top = "calc(15% + " + y + "px)";
            }
        }, 800);

        function tryReject() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";

            if (health > 1) {
                health--;
                document.getElementById('hearts').innerText = "❤️".repeat(health) + "🖤".repeat(3 - health);
                if(health === 2) document.getElementById('dialog').innerText = "Dibilang gak boleh nolak! 😤";
                if(health === 1) document.getElementById('dialog').innerText = "Nyawa tinggal 1 nih, klik tombol hijau aja! 💥";
            } else {
                noBtn.classList.add('hidden');
                document.getElementById('dialog').innerText = "Nyawa habis! Harus ikut jalan! 😜";
            }
        }

        function nextStep() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function selectTime(waktu, id) {
            selectedTimeValue = waktu;
            document.querySelectorAll('.time-box').forEach(function(box) { box.classList.remove('selected'); });
            document.getElementById(id).classList.add('selected');
        }

        function submitStep2() {
            if (selectedTimeValue === "") {
                alert("Pilih opsi waktunya dulu! 😁");
                return;
            }
            const tempat = document.getElementById('tempat').value || "Terserah";
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
            document.getElementById('finalMessage').innerText = "Fix ketemu besok jam " + selectedTimeValue + " di [ " + tempat + " ]";
        }

        function sendToWhatsApp() {
    const tempat = document.getElementById('tempat').value || "Terserah";
    
    // FORMAT BARU: Menggunakan tautan universal wa.me yang disukai WhatsApp
    // PENTING: Ganti 628123456789 di bawah ini dengan NOMOR WHATSAPP KAMU SENDIRI
    const nomorSaya = "6283151972260"; 
    
    const teks = "Woi! Gua udah isi: %0A⏰ Waktu: " + selectedTimeValue + "%0A📍 Tempat: " + tempat + "%0A%0AFix besok ya! 😎";
    
    // Membuka tab baru secara aman agar tidak dianggap sebagai bug/spam oleh browser
    window.open("https://wa.me/" + nomorSaya + "?text=" + teks, "_blank");
}
    </script>
</body>
