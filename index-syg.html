<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinyal Kedekatan ✨</title>
    <style>
        /* Background Ramai Tapi Fresh & Playful (Gradasi Peach ke Kuning Cerah) */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Hujan Bintang & Kilauan Lucu di Background */
        .sparkle-fall {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            animation: fall linear infinite;
            z-index: 1;
            user-select: none;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* Kartu Pop-up Modern */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 380px;
            width: 90%;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 10;
            border: 3px solid #ff758c;
        }
        
        h2 {
            color: #d81159;
            font-size: 22px;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        p.sub-text {
            color: #666;
            font-size: 14px;
            margin-top: -5px;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: space-around;
            position: relative;
            margin-top: 30px;
            height: 60px;
        }

        button {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background: linear-gradient(45deg, #ff5e62, #ff9966);
            color: white;
            z-index: 10;
            animation: pulse 1.5s infinite;
        }

        #noBtn {
            background: linear-gradient(45deg, #bdc3c7, #2c3e50);
            color: white;
            position: absolute;
            transition: left 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), top 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Grid Pilihan Waktu & Jam */
        .time-options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .time-btn {
            background: white;
            color: #d81159;
            border: 2px solid #ff9a9e;
            border-radius: 15px;
            padding: 12px;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            box-shadow: none;
        }

        .time-btn span.hour {
            background: #ffe5ec;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .time-btn:hover {
            background: #ff5e62;
            color: white;
            border-color: #ff5e62;
            transform: translateY(-2px);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- STEP 1: Pertanyaan PDKT / HTS Santai -->
    <div id="step1" class="card">
        <h2>Besok luang gak? Jalan yuk, ada yang mau gua ceritain nih.. 🤔✨</h2>
        <p class="sub-text">Bukan urusan negara kok, santai aja!</p>
        <div class="buttons">
            <button id="yesBtn" onclick="nextStep()">Ayuk, Gass! 🏃‍♂️</button>
            <button id="noBtn" onmouseover="teleportButton()" onclick="onclick="teleportButton()"">Mager / Sibuk</button>
        </div>
    </div>

    <!-- STEP 2: Pilihan Waktu + Jam Detail -->
    <div id="step2" class="card hidden">
        <h2>Oke mantap, enaknya jam berapa? ⏰</h2>
        <p class="sub-text">Cocokkan jadwal kita biar gak bentrok</p>
        <div class="time-options">
            <button class="time-btn" onclick="finish('Pagi (Jam 09:00)')">
                <span>🌅 Pagi Segar</span> <span class="hour">09:00 WIB</span>
            </button>
            <button class="time-btn" onclick="finish('Siang (Jam 13:00)')">
                <span>☀️ Siang Cari Makan</span> <span class="hour">13:00 WIB</span>
            </button>
            <button class="time-btn" onclick="finish('Sore (Jam 16:30)')">
                <span>🌆 Sore Santai</span> <span class="hour">16:30 WIB</span>
            </button>
            <button class="time-btn" onclick="finish('Malam (Jam 19:00)')">
                <span>🌙 Malam Cari Angin</span> <span class="hour">19:00 WIB</span>
            </button>
        </div>
    </div>

    <!-- STEP 3: Pesan Akhir (Cocok Buat Gebetan) -->
    <div id="step3" class="card hidden">
        <h2>Deal ya! 🤝🔥</h2>
        <p id="finalMessage" style="font-size: 16px; color: #333; font-weight: bold; line-height: 1.5;"></p>
        <p style="font-size: 13px; color: #777;">Sampai ketemu besok! Jangan lupa mandi 😂</p>
    </div>

    <script>
        let autoMoveInterval;

        window.onload = function() {
            startAutoMove();
            createSparkles(); // Efek kilauan bintang di background
        };

        // 1. Efek Background Kilauan Bintang & Hati Tipis
        function createSparkles() {
            const icons = ['✨', '✨', '⭐', '🌸', '🎵'];
            for (let i = 0; i < 25; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle-fall');
                sparkle.innerText = icons[Math.floor(Math.random() * icons.length)];
                sparkle.style.left = Math.random() * 100 + 'vw';
                sparkle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                sparkle.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(sparkle);
            }
        }

        // 2. Pergerakan Otomatis Tombol 'Mager'
        function startAutoMove() {
            autoMoveInterval = setInterval(() => {
                const noBtn = document.getElementById('noBtn');
                if (noBtn && !noBtn.closest('.hidden')) {
                    const x = Math.random() * 140 - 70; 
                    const y = Math.random() * 80 - 40; 
                    noBtn.style.left = `calc(50% + ${x}px)`;
                    noBtn.style.top = `calc(15% + ${y}px)`;
                }
            }, 700);
        }

        // 3. Teleportasi Jika Berhasil Didekati
        function teleportButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        // 4. Pindah Langkah
        function nextStep() {
            clearInterval(autoMoveInterval); 
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        // 5. Konfirmasi Akhir
        function finish(waktu) {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
            document.getElementById('finalMessage').innerText = `Sip, fix ketemu besok pas ${waktu} ya. Nanti kabarin aja kalau mau berangkat! 😎`;
        }
    </script>
</body>
</html>
